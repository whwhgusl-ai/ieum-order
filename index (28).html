              </div>
              <div className="order-card-items">
                {o.items.slice(0,3).map((i,idx) => <span key={idx} className="item-chip">{i.name}</span>)}
                {o.items.length > 3 && <span className="item-chip">+{o.items.length-3}</span>}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );

  return (
    <div className="screen">
      <div className="header">
        <button className="back-btn" onClick={() => setSelectedOrder(null)}>←</button>
        <div className="header-left"><div className="header-title">반품 품목 선택</div><div className="header-sub">{formatDate(selectedOrder.timestamp)}</div></div>
        {selectedItems.length > 0 && <div className="badge" style={{color:'var(--danger)'}}>{selectedItems.length}품목</div>}
      </div>
      <div className="scrollable">
        <div style={{fontSize:13,color:'var(--info)',padding:'8px 0 14px',lineHeight:1.6}}>
          반품 수량을 입력하고 사유를 선택해 주세요.<br/>수량 0이면 반품 제외됩니다.
        </div>
        {selectedOrder.items.map(item => {
          const rv = returnItems[item.name] || { qty: 0, reason: RETURN_REASONS[0] };
          return (
            <div key={item.name} style={{background:'var(--surface)',border:`1px solid ${rv.qty>0?'var(--gold-border)':'var(--border)'}`,borderRadius:12,padding:'13px 14px',marginBottom:8}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:rv.qty>0?10:0}}>
                <div>
                  <div style={{fontSize:14,fontWeight:600}}>{item.name}</div>
                  <div style={{fontSize:11,color:'var(--text3)'}}>{item.category} · 발주 {item.qty}개</div>
                </div>
                <div className="qty-row">
                  <button className="qty-btn" onClick={() => setItemQty(item.name, rv.qty-1)}>−</button>
                  <span className={`qty-num${rv.qty===0?' zero':''}`}>{rv.qty}</span>
                  <button className="qty-btn plus" onClick={() => setItemQty(item.name, Math.min(rv.qty+1, item.qty))}>+</button>
                </div>
              </div>
              {rv.qty > 0 && (
                <div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:8}}>
                  {RETURN_REASONS.map(r => (
                    <button key={r} onClick={() => setItemReason(item.name, r)}
                      style={{padding:'5px 12px',borderRadius:20,fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:'inherit',
                        background:rv.reason===r?'rgba(224,92,92,0.2)':'var(--surface3)',
                        color:rv.reason===r?'var(--danger)':'var(--text2)',
                        border:`1.5px solid ${rv.reason===r?'rgba(224,92,92,0.5)':'var(--border)'}`}}>
                      {r}
                    </button>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>
      <div className="bottom-bar">
        <button className="btn-danger" disabled={!selectedItems.length || submitting} onClick={handleSubmit}>
          {submitting ? '신청 중...' : `반품 신청 (${selectedItems.length}품목)`}
        </button>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════
//  지점 상세보기 모달 (아코디언)
// ════════════════════════════════════════════════════
function BranchDetailModal({ branch, orders, branchProds, branchTotalAmt, branchTotalQty, onClose }) {
  const [openDesigner, setOpenDesigner] = useState(null); // orderId
  const [openTotal, setOpenTotal] = useState(false);

  function exportBranchExcel() {
    const wb = XLSX.utils.book_new();
    const today = new Date();
    const dateStr = `${today.getFullYear()}${String(today.getMonth()+1).padStart(2,'0')}${String(today.getDate()).padStart(2,'0')}`;

    // ① 디자이너별 개별 시트 (날짜 포함)
    // 같은 이름 디자이너의 여러 발주를 하나의 시트에 합치기
    const designerMap = {};
    orders.forEach(o => {
      const dName = o.name;
      if (!designerMap[dName]) designerMap[dName] = [];
      designerMap[dName].push(o);
    });

    Object.entries(designerMap).forEach(([dName, dOrders]) => {
      const rows = [['발주날짜', '제품명', '카테고리', '수량', '직원가', '금액']];
      let totalQty = 0, totalAmt = 0;
      dOrders.forEach(o => {
        const dateLabel = formatDate(o.timestamp).split(' ')[0]; // 날짜 부분만
        o.items.forEach(item => {
          rows.push([
            dateLabel,
            item.name,
            item.category,
            item.qty,
            item.employeePrice > 0 ? item.employeePrice : '',
            item.amount > 0 ? item.amount : ''
          ]);
          totalQty += item.qty;
          totalAmt += item.amount || 0;
        });
        rows.push(['','','','','','']); // 발주건 사이 빈줄
      });
      // 디자이너 합계
      rows.push(['[합계]', '', '', totalQty, '', totalAmt > 0 ? totalAmt : '']);
      const ws = XLSX.utils.aoa_to_sheet(rows);
      ws['!cols'] = [{wch:10},{wch:22},{wch:14},{wch:6},{wch:8},{wch:10}];
      // 시트명은 디자이너 이름 (31자 제한)
      XLSX.utils.book_append_sheet(wb, ws, dName.slice(0,31));
    });

    // ② 공급사별 합계 시트
    const supMap = {};
    orders.forEach(o => {
      o.items.forEach(item => {
        const s = item.supplier || item.category || '기타';
        if (!supMap[s]) supMap[s] = {};
        if (!supMap[s][item.name]) supMap[s][item.name] = { name:item.name, category:item.category, qty:0, empAmt:0, hqAmt:0 };
        supMap[s][item.name].qty    += item.qty;
        supMap[s][item.name].empAmt += item.amount || 0;
        supMap[s][item.name].hqAmt  += item.hqAmount || 0;
      });
    });
    const supRows = [['공급사', '제품명', '카테고리', '총수량', '직원가합계', '본사가합계']];
    Object.entries(supMap).forEach(([sup, prods]) => {
      Object.values(prods).forEach(p => {
        supRows.push([sup, p.name, p.category, p.qty,
          p.empAmt > 0 ? p.empAmt : '',
          p.hqAmt > 0 ? p.hqAmt : '']);
      });
    });
    const ws2 = XLSX.utils.aoa_to_sheet(supRows);
    ws2['!cols'] = [{wch:10},{wch:22},{wch:14},{wch:8},{wch:10},{wch:10}];
    XLSX.utils.book_append_sheet(wb, ws2, '공급사별 합계');

    // ③ 지점 전체 합계 시트
    const totalRows = [['제품명', '카테고리', '총수량', '직원가합계']];
    branchProds.forEach(p => {
      totalRows.push([p.name, p.category, p.total, p.amt > 0 ? p.amt : '']);
    });
    if (branchTotalAmt > 0) totalRows.push(['', '[합계]', branchTotalQty, branchTotalAmt]);
    const ws3 = XLSX.utils.aoa_to_sheet(totalRows);
    ws3['!cols'] = [{wch:22},{wch:14},{wch:8},{wch:10}];
    XLSX.utils.book_append_sheet(wb, ws3, '지점합계');

    XLSX.writeFile(wb, `${branch}_발주서_${dateStr}.xlsx`);
  }

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-sheet" style={{maxHeight:'90vh',overflowY:'auto',padding:'20px 0 40px'}} onClick={e => e.stopPropagation()}>

        {/* 헤더 */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 20px',marginBottom:16}}>
          <div>
            <div style={{fontSize:19,fontWeight:800}}>{branch}</div>
            <div style={{fontSize:12,color:'var(--text3)',marginTop:2}}>발주 상세 내역</div>
          </div>
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            <button onClick={exportBranchExcel} style={{background:'var(--gold)',border:'none',color:'#000',fontSize:12,fontWeight:700,cursor:'pointer',padding:'7px 12px',borderRadius:8,fontFamily:'inherit'}}>📊 엑셀</button>
            <button onClick={onClose} style={{background:'var(--surface3)',border:'none',color:'var(--text2)',fontSize:14,cursor:'pointer',width:32,height:32,borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button>
          </div>
        </div>

        {/* 디자이너별 아코디언 */}
        <div style={{padding:'0 20px'}}>
          {orders.length === 0 && <div className="empty-state">발주 내역이 없습니다</div>}
          {orders.map(o => {
            const amt = o.items.reduce((s,i) => s+i.amount, 0);
            const isOpen = openDesigner === o.orderId;
            return (
              <div key={o.orderId} style={{marginBottom:8,border:'1px solid var(--border)',borderRadius:12,overflow:'hidden'}}>
                {/* 디자이너 행 — 클릭으로 펼치기 */}
                <div
                  onClick={() => setOpenDesigner(isOpen ? null : o.orderId)}
                  style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'13px 14px',background:'var(--surface2)',cursor:'pointer',userSelect:'none'}}
                >
                  <div style={{display:'flex',alignItems:'center',gap:10}}>
                    <div style={{width:34,height:34,background:'var(--gold)',borderRadius:9,display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,fontWeight:800,color:'#000',flexShrink:0}}>
                      {o.name.charAt(0)}
                    </div>
                    <div>
                      <div style={{fontSize:15,fontWeight:700}}>{o.name}</div>
                      <div style={{fontSize:11,color:'var(--text3)'}}>{o.items.length}품목 · {formatDate(o.timestamp)}</div>
                    </div>
                  </div>
                  <div style={{textAlign:'right',display:'flex',alignItems:'center',gap:10}}>
                    <div>
                      <StatusBadge status={o.status}/>
                      {amt > 0 && <div style={{fontSize:13,color:'var(--gold)',fontWeight:800,marginTop:4}}>{amt.toLocaleString()}원</div>}
                    </div>
                    <span style={{color:'var(--text3)',fontSize:16,transition:'transform .2s',display:'inline-block',transform:isOpen?'rotate(90deg)':'rotate(0deg)'}}>›</span>
                  </div>
                </div>
                {/* 품목 목록 — 펼쳐질 때만 */}
                {isOpen && (
                  <div>
                    {o.items.map((item,i) => (
                      <div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 14px',background:i%2===0?'var(--surface)':'var(--surface2)',borderTop:'1px solid var(--border)'}}>
                        <div>
                          <div style={{fontSize:13,fontWeight:600}}>{item.name}</div>
                          <div style={{fontSize:11,color:'var(--text3)',marginTop:1}}>{item.category}</div>
                        </div>
                        <div style={{textAlign:'right',flexShrink:0,marginLeft:12}}>
                          <div style={{fontSize:14,fontWeight:800,color:'var(--gold)'}}>{item.qty}개</div>
                          {item.amount > 0 && <div style={{fontSize:11,color:'var(--text3)'}}>직원가 {item.amount.toLocaleString()}원</div>}
                          {item.hqAmount > 0 && item.hqAmount !== item.amount && <div style={{fontSize:11,color:'var(--info)'}}>본사가 {item.hqAmount.toLocaleString()}원</div>}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            );
          })}

          {/* 지점 전체 합계 아코디언 */}
          {branchProds.length > 0 && (
            <div style={{marginTop:8,border:'1.5px solid var(--gold-border)',borderRadius:12,overflow:'hidden'}}>
              {/* 합계 행 — 클릭으로 펼치기 */}
              <div
                onClick={() => setOpenTotal(!openTotal)}
                style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'13px 14px',background:'rgba(200,164,74,0.12)',cursor:'pointer',userSelect:'none'}}
              >
                <div style={{display:'flex',alignItems:'center',gap:10}}>
                  <div style={{width:34,height:34,background:'rgba(200,164,74,0.2)',borderRadius:9,display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,flexShrink:0}}>📦</div>
                  <div>
                    <div style={{fontSize:15,fontWeight:800,color:'var(--gold)'}}>{branch} 전체 합계</div>
                    <div style={{fontSize:11,color:'var(--text3)'}}>{branchProds.length}품목 · {branchTotalQty}개</div>
                  </div>
                </div>
                <div style={{textAlign:'right',display:'flex',alignItems:'center',gap:10}}>
                  {branchTotalAmt > 0 && <div style={{fontSize:14,fontWeight:800,color:'var(--gold)'}}>{branchTotalAmt.toLocaleString()}원</div>}
                  <span style={{color:'var(--gold)',fontSize:16,transition:'transform .2s',display:'inline-block',transform:openTotal?'rotate(90deg)':'rotate(0deg)'}}>›</span>
                </div>
              </div>
              {/* 전체 품목 목록 */}
              {openTotal && branchProds.map((p,i) => (
                <div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 14px',background:i%2===0?'var(--surface)':'var(--surface2)',borderTop:'1px solid var(--border)'}}>
                  <div>
                    <span style={{fontSize:13,fontWeight:600}}>{p.name}</span>
                    <span style={{fontSize:11,color:'var(--text3)',marginLeft:6}}>{p.category}</span>
                  </div>
                  <div style={{textAlign:'right',flexShrink:0}}>
                    <span style={{fontSize:14,fontWeight:800,color:'var(--gold)'}}>{p.total}개</span>
                    {p.amt > 0 && <span style={{fontSize:11,color:'var(--text3)',marginLeft:8}}>{p.amt.toLocaleString()}원</span>}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════
//  본사 앱 (이승섭 이사)
// ════════════════════════════════════════════════════
function HQApp({ user, onLogout }) {
  const [tab, setTab] = useState('users');
  const [users, setUsers] = useState([]);
  const [orders, setOrders] = useState([]);
  const [loading, setLoading] = useState(false);
  const [rejectModal, setRejectModal] = useState(null);
  const [rejectReason, setRejectReason] = useState('');
  const [editModal, setEditModal] = useState(null);
  const [editBranch, setEditBranch] = useState('');
  const [editRole, setEditRole] = useState('');
  const [branchDetail, setBranchDetail] = useState(null); // 지점 상세보기
  const [hqReturns, setHqReturns] = useState([]);
  const hqPendingReturns = hqReturns.filter(r => r.status === '대기');

  function loadHqReturns() {
    apiGet({ action:'returns' }).then(d => { if(d.returns) setHqReturns(d.returns); }).catch(()=>{});
  }

  function exportReturnExcel() {
    const approvedReturns = hqReturns.filter(r => r.status === '승인');
    if (!approvedReturns.length) { alert('승인된 반품이 없습니다.'); return; }
    const wb = XLSX.utils.book_new();
    const today = new Date();
    const dateStr = `${today.getFullYear()}${String(today.getMonth()+1).padStart(2,'0')}${String(today.getDate()).padStart(2,'0')}`;
    const rows = [['지점','신청자','제품명','카테고리','반품수량','사유','신청일']];
    approvedReturns.forEach(r => {
      r.items.forEach(item => {
        rows.push([r.branch, r.name, item.name, item.category, item.qty, item.reason, formatDate(r.timestamp)]);
      });
    });
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{wch:8},{wch:10},{wch:22},{wch:14},{wch:8},{wch:10},{wch:12}];
    XLSX.utils.book_append_sheet(wb, ws, '반품내역');
    XLSX.writeFile(wb, `430헤어_반품서_${dateStr}.xlsx`);
  }

  function loadUsers() {
    setLoading(true);
    apiGet({ action:'users' }).then(d=>{if(d.users) setUsers(d.users);}).catch(()=>{}).finally(()=>setLoading(false));
  }
  function loadOrders() {
    setLoading(true);
    apiGet({ action:'orders' }).then(d=>{if(d.orders) setOrders(d.orders);}).catch(()=>{}).finally(()=>setLoading(false));
  }
  useEffect(()=>{loadUsers();},[]);
  useEffect(()=>{ if(tab==='orders') loadOrders(); else if(tab==='users') loadUsers(); },[tab]);

  async function handleApprove(userId) {
    const res = await apiPost({ action:'approveUser', userId });
    if(res.success) setUsers(p=>p.map(u=>u.userId===userId?{...u,status:'승인'}:u));
  }
  async function handleReject(userId, reason) {
    const res = await apiPost({ action:'rejectUser', userId, reason });
    if(res.success) { setUsers(p=>p.map(u=>u.userId===userId?{...u,status:'반려',rejectReason:reason}:u)); setRejectModal(null); }
  }
  async function handleDeactivate(userId) {
    if(!window.confirm('이 계정을 비활성화 하시겠습니까?')) return;
    const res = await apiPost({ action:'deactivateUser', userId });
    if(res.success) setUsers(p=>p.map(u=>u.userId===userId?{...u,status:'비활성'}:u));
  }
  async function handleUpdate() {
    if(!editModal) return;
    const res = await apiPost({ action:'updateUser', userId:editModal.userId, branch:editBranch, role:editRole });
    if(res.success) { setUsers(p=>p.map(u=>u.userId===editModal.userId?{...u,branch:editBranch,role:editRole}:u)); setEditModal(null); alert('✅ 수정 완료'); }
  }

  function exportExcel() {
    // 승인 이상 단계 모두 포함
    const targetOrders = orders.filter(o => ['승인','전송완료','입고완료','분출완료'].includes(o.status));
    if (!targetOrders.length) { alert('승인된 발주가 없습니다.'); return; }
    const wb = XLSX.utils.book_new();
    const supMap = {};
    targetOrders.forEach(o => {
      o.items.forEach(item => {
        const s = item.supplier || '기타';
        if (!supMap[s]) supMap[s] = {};
        if (!supMap[s][item.name]) supMap[s][item.name] = {
          name: item.name, category: item.category,
          employeePrice: item.employeePrice || 0,
          hqPrice: item.hqPrice || 0,
          total: 0, byBranch: {}
        };
        supMap[s][item.name].total += item.qty;
        supMap[s][item.name].byBranch[o.branch] = (supMap[s][item.name].byBranch[o.branch] || 0) + item.qty;
      });
    });
    Object.keys(supMap).forEach(sup => {
      const prods = Object.values(supMap[sup]);
      // 헤더: 제품명, 카테고리, 직원가, 지점별 수량, 합계
      const rows = [['제품명','카테고리','직원가','본사가', ...BRANCHES, '합계']];
      prods.forEach(p => rows.push([
        p.name, p.category,
        p.employeePrice > 0 ? p.employeePrice : '',
        p.hqPrice > 0 ? p.hqPrice : '',
        ...BRANCHES.map(b => p.byBranch[b] || 0),
        p.total
      ]));
      const ws = XLSX.utils.aoa_to_sheet(rows);
      ws['!cols'] = [{wch:22},{wch:14},{wch:8},...BRANCHES.map(()=>({wch:7})),{wch:6}];
      // 헤더 행 스타일
      XLSX.utils.book_append_sheet(wb, ws, sup.slice(0,31));
    });
    // 전체 합계 시트 추가
    const allMap = {};
    targetOrders.forEach(o => o.items.forEach(item => {
      if (!allMap[item.name]) allMap[item.name] = {
        name: item.name, category: item.category, supplier: item.supplier||'',
        employeePrice: item.employeePrice||0, hqPrice: item.hqPrice||0, total: 0, byBranch: {}
      };
      allMap[item.name].total += item.qty;
      allMap[item.name].byBranch[o.branch] = (allMap[item.name].byBranch[o.branch]||0) + item.qty;
    }));
    const summaryRows = [['제품명','카테고리','공급사','직원가','본사가',...BRANCHES,'합계']];
    Object.values(allMap).sort((a,b) => a.category.localeCompare(b.category))
      .forEach(p => summaryRows.push([
        p.name, p.category, p.supplier,
        p.employeePrice > 0 ? p.employeePrice : '',
        p.hqPrice > 0 ? p.hqPrice : '',
        ...BRANCHES.map(b => p.byBranch[b]||0), p.total
      ]));
    const summaryWs = XLSX.utils.aoa_to_sheet(summaryRows);
    summaryWs['!cols'] = [{wch:22},{wch:14},{wch:8},{wch:8},...BRANCHES.map(()=>({wch:7})),{wch:6}];
    XLSX.utils.book_append_sheet(wb, summaryWs, '전체합계');
    const d = new Date();
    XLSX.writeFile(wb, `430헤어_발주서_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.xlsx`);
  }

  const pending=users.filter(u=>u.status==='대기');
  const approved=users.filter(u=>u.status==='승인');
  const others=users.filter(u=>!['대기','승인'].includes(u.status));

  return (
    <div className="screen">
      <div className="header">
        <div className="header-left">
          <div className="logo-chip" style={{fontSize:11}}>본사</div>
          <div><div className="header-title">이승섭 이사</div><div className="header-sub">전체 관리</div></div>
        </div>
        <div style={{display:'flex',gap:10,alignItems:'center'}}>
          {tab==='orders'&&<button className="export-btn" onClick={exportExcel}>엑셀</button>}
          <button onClick={()=>{if(tab==='users') loadUsers(); else loadOrders();}} style={{background:'none',border:'none',color:'var(--text3)',cursor:'pointer',fontSize:18}}>↻</button>
          <button onClick={onLogout} style={{background:'none',border:'none',color:'var(--text3)',cursor:'pointer',fontSize:13}}>로그아웃</button>
        </div>
      </div>
      <div className="mgr-tabs">
        <div className={`mgr-tab${tab==='users'?' active':''}`} onClick={()=>setTab('users')}>
          사용자 관리 {pending.length>0&&<span style={{background:'var(--danger)',color:'#fff',borderRadius:10,padding:'1px 6px',fontSize:10,marginLeft:4}}>{pending.length}</span>}
        </div>
        <div className={`mgr-tab${tab==='orders'?' active':''}`} onClick={()=>setTab('orders')}>발주 현황</div>
        <div className={`mgr-tab${tab==='costs'?' active':''}`} onClick={()=>setTab('costs')}>금액내역</div>
        <div className={`mgr-tab${tab==='returns'?' active':''}`} onClick={()=>{setTab('returns');loadHqReturns();}}>반품현황 {hqPendingReturns.length>0&&<span style={{background:'var(--danger)',color:'#fff',borderRadius:10,padding:'1px 6px',fontSize:10,marginLeft:4}}>{hqPendingReturns.length}</span>}</div>
        <div className={`mgr-tab${tab==='monthly'?' active':''}`} onClick={()=>setTab('monthly')}>월별리포트</div>
      </div>
      {loading?<Spinner/>:tab==='users'?(
        <div className="scrollable">
          {pending.length>0&&(
            <>
              <div className="section-title">승인 대기 ({pending.length})</div>
              {pending.map(u=>(
                <div key={u.userId} className="user-card" style={{borderColor:'rgba(200,164,74,0.4)'}}>
                  <div className="user-card-header">
                    <div><div className="user-name">{u.name}</div><div className="user-meta">{u.branch} · {u.role}</div><div className="user-id">ID: {u.userId}</div></div>
                    <div style={{fontSize:11,color:'var(--text3)'}}>{formatDate(u.joinedAt)}</div>
                  </div>
                  <div style={{display:'flex',gap:8,marginTop:8}}>
                    <button onClick={()=>handleApprove(u.userId)} style={{flex:1,background:'rgba(82,183,136,.15)',color:'var(--success)',border:'1.5px solid rgba(82,183,136,.4)',borderRadius:10,padding:'10px',fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>✓ 승인</button>
                    <button onClick={()=>{setRejectModal(u.userId);setRejectReason('');}} style={{flex:1,background:'rgba(224,92,92,.15)',color:'var(--danger)',border:'1.5px solid rgba(224,92,92,.4)',borderRadius:10,padding:'10px',fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>✕ 반려</button>
                    <button onClick={()=>{setEditModal(u);setEditBranch(u.branch);setEditRole(u.role);}} style={{background:'var(--surface3)',color:'var(--text2)',border:'1.5px solid var(--border)',borderRadius:10,padding:'10px 14px',fontSize:13,cursor:'pointer',fontFamily:'inherit'}}>수정</button>
                  </div>
                </div>
              ))}
            </>
          )}
          {approved.length>0&&(
            <>
              <div className="section-title">승인된 사용자 ({approved.length})</div>
              {approved.map(u=>(
                <div key={u.userId} className="user-card">
                  <div className="user-card-header">
                    <div><div className="user-name">{u.name}</div><div className="user-meta">{u.branch} · {u.role}</div><div className="user-id">ID: {u.userId}</div></div>
                    <StatusBadge status={u.status}/>
                  </div>
                  <div style={{display:'flex',gap:8,marginTop:8}}>
                    <button onClick={()=>{setEditModal(u);setEditBranch(u.branch);setEditRole(u.role);}} style={{flex:1,background:'var(--surface3)',color:'var(--text2)',border:'1.5px solid var(--border)',borderRadius:10,padding:'9px',fontSize:13,cursor:'pointer',fontFamily:'inherit'}}>지점/역할 수정</button>
                    <button onClick={()=>handleDeactivate(u.userId)} style={{background:'var(--surface3)',color:'var(--text3)',border:'1.5px solid var(--border)',borderRadius:10,padding:'9px 14px',fontSize:13,cursor:'pointer',fontFamily:'inherit'}}>비활성</button>
                  </div>
                </div>
              ))}
            </>
          )}
          {others.length>0&&(
            <>
              <div className="section-title">기타 ({others.length})</div>
              {others.map(u=>(
                <div key={u.userId} className="user-card" style={{opacity:.6}}>
                  <div className="user-card-header">
                    <div><div className="user-name">{u.name}</div><div className="user-meta">{u.branch} · {u.role}</div><div className="user-id">ID: {u.userId}</div></div>
                    <StatusBadge status={u.status}/>
                  </div>
                  {u.status==='반려'&&u.rejectReason&&<div style={{fontSize:12,color:'var(--danger)',marginTop:4}}>반려: {u.rejectReason}</div>}
                  {u.status!=='승인'&&<button onClick={()=>handleApprove(u.userId)} style={{marginTop:8,width:'100%',background:'var(--surface3)',color:'var(--text2)',border:'1.5px solid var(--border)',borderRadius:10,padding:'9px',fontSize:13,cursor:'pointer',fontFamily:'inherit'}}>재승인</button>}
                </div>
              ))}
            </>
          )}
          {users.length===0&&<div className="empty-state">사용자가 없습니다</div>}
        </div>
      ):tab==='orders'?(
        <div className="scrollable">
          {BRANCHES.map(b=>{
            const bo=orders.filter(o=>o.branch===b);
            const stats={대기:0,승인:0,전송완료:0,입고완료:0,분출완료:0,반려:0};
            bo.forEach(o=>{if(stats[o.status]!==undefined) stats[o.status]++;});
            const hasActive = bo.filter(o=>o.status!=='반려').length > 0;
            return (
              <div key={b} className="branch-status-card"
                style={{cursor: hasActive ? 'pointer' : 'default'}}
                onClick={() => hasActive && setBranchDetail(b)}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                  <div>
                    <div style={{fontSize:15,fontWeight:700}}>{b}</div>
                    <div className="stat-chips">
                      {stats.대기>0&&<span className="stat-chip" style={{background:'rgba(153,153,153,.15)',color:'#aaa'}}>대기 {stats.대기}</span>}
                      {stats.승인>0&&<span className="stat-chip" style={{background:'rgba(82,183,136,.15)',color:'var(--success)'}}>승인 {stats.승인}</span>}
                      {stats.전송완료>0&&<span className="stat-chip" style={{background:'rgba(91,156,246,.15)',color:'var(--info)'}}>전송 {stats.전송완료}</span>}
                      {stats.입고완료>0&&<span className="stat-chip" style={{background:'rgba(167,119,219,.15)',color:'#b794f4'}}>입고 {stats.입고완료}</span>}
                      {stats.분출완료>0&&<span className="stat-chip" style={{background:'var(--gold-dim)',color:'var(--gold)'}}>완료 {stats.분출완료}</span>}
                      {bo.length===0&&<span style={{fontSize:12,color:'var(--text3)'}}>발주 없음</span>}
                    </div>
                  </div>
                  {hasActive && <span style={{color:'var(--text3)',fontSize:16}}>›</span>}
                </div>
              </div>
            );
          })}
          {orders.filter(o=>['승인','전송완료','입고완료','분출완료'].includes(o.status)).length>0&&(
            <div style={{marginTop:12}}>
              <button className="btn-gold" onClick={exportExcel}>📊 공급사별 발주서 엑셀 다운로드</button>
              <div style={{fontSize:12,color:'var(--text3)',textAlign:'center',marginTop:6}}>승인 이상 전체 · 공급사별 시트 + 전체합계 시트</div>
            </div>
          )}
        </div>
      ):tab==='costs'?(
        // 금액내역 탭
        <div className="scrollable">
          <div style={{fontSize:13,color:'var(--text3)',paddingBottom:12}}>지점별 · 선생님별 금액 내역 (직원가 / 본사가)</div>
          {BRANCHES.map(b=>{
            const dc={};
            orders.filter(o=>o.branch===b&&['전송완료','입고완료','분출완료'].includes(o.status))
              .forEach(o=>{dc[o.name]=(dc[o.name]||0)+o.items.reduce((s,i)=>s+i.amount,0);});
            if(!Object.keys(dc).length) return null;
            const total=Object.values(dc).reduce((s,v)=>s+v,0);
            return (
              <div key={b} className="summary-card">
                <div style={{fontSize:14,fontWeight:700,color:'var(--gold)',marginBottom:8,display:'flex',justifyContent:'space-between'}}><span>{b}</span><span>{total.toLocaleString()}원</span></div>
                {Object.entries(dc).map(([name,amt])=>(
                  <div key={name} className="summary-row">
                <span style={{color:'var(--text)',fontWeight:500}}>{name}</span>
                <div style={{textAlign:'right'}}>
                  <div style={{color:'var(--gold)',fontWeight:700,fontSize:13}}>{amt.toLocaleString()}원</div>
                  <div style={{color:'var(--info)',fontSize:11}}>본사가: {(orders.filter(o=>o.branch===b&&['전송완료','입고완료','분출완료'].includes(o.status)&&o.name===name).reduce((s,o)=>s+o.items.reduce((ss,i)=>ss+(i.hqAmount||0),0),0)).toLocaleString()}원</div>
                </div>
              </div>
                ))}
              </div>
            );
          })}
        </div>
      ) : tab==='returns' ? (
        <div className="scrollable">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',paddingBottom:12}}>
            <span style={{fontSize:13,color:'var(--text3)'}}>전체 지점 반품 현황</span>
            <button onClick={exportReturnExcel} style={{background:'var(--gold)',border:'none',color:'#000',borderRadius:8,padding:'7px 12px',fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>📊 반품 엑셀</button>
          </div>
          {hqReturns.length === 0 && <div className="empty-state">반품 신청이 없습니다</div>}
          {hqPendingReturns.length > 0 && <>
            <div className="section-title">승인 대기 ({hqPendingReturns.length})</div>
            {hqPendingReturns.map(r => (
              <div key={r.returnId} className="order-card" style={{borderColor:'rgba(224,92,92,0.3)'}}>
                <div className="order-card-header">
                  <div><div className="order-card-name">{r.branch} · {r.name}</div><div className="order-card-meta">{formatDate(r.timestamp)} · {r.items.length}품목</div></div>
                  <StatusBadge status={r.status}/>
                </div>
                <div className="order-card-items">
                  {r.items.map((i,idx) => <span key={idx} className="item-chip">{i.name} {i.qty}개 ({i.reason})</span>)}
                </div>
              </div>
            ))}
          </>}
          {hqReturns.filter(r=>r.status==='승인').length > 0 && <>
            <div className="section-title">승인완료 ({hqReturns.filter(r=>r.status==='승인').length})</div>
            {hqReturns.filter(r=>r.status==='승인').map(r => (
              <div key={r.returnId} className="order-card">
                <div className="order-card-header">
                  <div><div className="order-card-name">{r.branch} · {r.name}</div><div className="order-card-meta">{formatDate(r.timestamp)}</div></div>
                  <StatusBadge status={r.status}/>
                </div>
                <div className="order-card-items">
                  {r.items.map((i,idx) => <span key={idx} className="item-chip">{i.name} {i.qty}개</span>)}
                </div>
              </div>
            ))}
          </>}
        </div>
      ) : tab==='monthly' ? (
        <MonthlyReport />
      ) : null}

      {/* 반려 모달 */}
      {rejectModal&&(
        <div className="modal-overlay" onClick={()=>setRejectModal(null)}>
          <div className="modal-sheet" onClick={e=>e.stopPropagation()}>
            <div className="modal-title">반려 사유</div>
            <div className="reject-btns">{USER_REJECT_PRESETS.map(r=><button key={r} className={`reject-reason-btn${rejectReason===r?' sel':''}`} onClick={()=>setRejectReason(r)}>{r}</button>)}</div>
            <input className="input-field" placeholder="직접 입력..." value={rejectReason} onChange={e=>setRejectReason(e.target.value)} style={{marginBottom:12}}/>
            <button className="btn-danger" disabled={!rejectReason.trim()} onClick={()=>handleReject(rejectModal,rejectReason)}>반려 처리</button>
            <button className="btn-ghost" onClick={()=>setRejectModal(null)}>취소</button>
          </div>
        </div>
      )}

      {/* 수정 모달 */}
      {editModal&&(
        <div className="modal-overlay" onClick={()=>setEditModal(null)}>
          <div className="modal-sheet" onClick={e=>e.stopPropagation()}>
            <div className="modal-title">{editModal.name} 정보 수정</div>
            <div style={{marginBottom:14}}>
              <div className="section-label">지점 변경</div>
              <div className="branch-grid">{BRANCHES.map(b=><button key={b} className={`branch-btn${editBranch===b?' sel':''}`} onClick={()=>setEditBranch(b)}>{b}</button>)}</div>
            </div>
            <div style={{marginBottom:20}}>
              <div className="section-label">역할 변경</div>
              <div className="role-grid">{['디자이너','매니저'].map(r=><button key={r} className={`role-btn${editRole===r?' sel':''}`} onClick={()=>setEditRole(r)}>{r}</button>)}</div>
            </div>
            <button className="btn-gold" onClick={handleUpdate}>수정 완료</button>
            <button className="btn-ghost" onClick={()=>setEditModal(null)}>취소</button>
          </div>
        </div>
      )}

      {/* 지점 상세보기 모달 */}
      {branchDetail && (()=> {
        const bOrders = orders.filter(o => o.branch === branchDetail && o.status !== '반려');
        const pMap = {};
        bOrders.forEach(o => o.items.forEach(item => {
          if (!pMap[item.name]) pMap[item.name] = {name:item.name, category:item.category, total:0, amt:0};
          pMap[item.name].total += item.qty;
          pMap[item.name].amt += item.amount;
        }));
        const branchProds = Object.values(pMap).sort((a,b) => a.category.localeCompare(b.category));
        const branchTotalAmt = branchProds.reduce((s,p) => s+p.amt, 0);
        const branchTotalQty = branchProds.reduce((s,p) => s+p.total, 0);
        return (
          <BranchDetailModal
            branch={branchDetail}
            orders={bOrders}
            branchProds={branchProds}
            branchTotalAmt={branchTotalAmt}
            branchTotalQty={branchTotalQty}
            onClose={() => setBranchDetail(null)}
          />
        );
      })()}
    </div>
  );
}

// ════════════════════════════════════════════════════
//  앱 루트
// ════════════════════════════════════════════════════
function App() {
  const [user, setUser] = useState(null);

  if (!user) return <AuthScreen onLogin={setUser} />;
  if (user.role === '본사') return <HQApp user={user} onLogout={() => setUser(null)} />;
  if (user.role === '매니저') return <ManagerApp user={user} onLogout={() => setUser(null)} />;
  return <DesignerApp user={user} onLogout={() => setUser(null)} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
