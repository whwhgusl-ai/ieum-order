name: 발주시스템 헬스체크
# 직원 43명이 쓰는 발주 GAS가 살아있는지 2시간마다 클라우드에서 확인.
# 죽었을 때만 대표님 텔레그램으로 알린다. (매장에서 전화 오기 전에 먼저 안다)
on:
  schedule:
    - cron: "0 */2 * * *"   # 2시간마다 (UTC)
  workflow_dispatch:
jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - name: GAS 응답 확인 (3회 재시도)
        id: ping
        shell: bash
        run: |
          URL="https://script.google.com/macros/s/AKfycbzA2mg82K0mMO6Mt2qsYMdYj8GL77MTC3ZGxHjNT5-VoYNyEJDg5cQHQAMdVVtdENzU7w/exec"
          for i in 1 2 3; do
            CODE=$(curl -sL -o /tmp/body -w "%{http_code}" --max-time 30 "$URL" || echo 000)
            SIZE=$(wc -c < /tmp/body)
            echo "시도 $i: HTTP $CODE, 본문 ${SIZE}바이트"
            if [ "$CODE" = "200" ] && [ "$SIZE" -gt 100 ]; then
              echo "status=ok" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep 20
          done
          echo "status=fail" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
      - name: 죽었으면 텔레그램 알림
        if: steps.ping.outputs.status == 'fail'
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "${TG_TOKEN:-}" ] && { echo "텔레그램 미설정"; exit 0; }
          curl -fsS "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            --data-urlencode text="🚨 [발주시스템] GAS가 응답하지 않습니다 (HTTP ${{ steps.ping.outputs.code }}, 3회 재시도 실패). 매장 발주가 막힐 수 있습니다. https://whwhgusl-ai.github.io/ieum-order 에서 확인해 주세요." >/dev/null
