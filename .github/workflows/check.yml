name: 배포 전 자동검사
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 인라인 JS 문법 + babel 금지 검사
        run: |
          python3 - <<'PY'
          import io,re,sys
          s=io.open('index.html',encoding='utf-8').read()
          if 'babel' in s.lower(): sys.exit('❌ babel/standalone 발견 — 블랙스크린 원인, 배포 금지')
          m=re.findall(r'<script>(.*?)</script>',s,re.S)
          io.open('/tmp/check.js','w',encoding='utf-8').write('\n'.join(m))
          print(f'인라인 스크립트 {len(m)}개 추출')
          PY
          node --check /tmp/check.js && echo "✅ 문법 통과"
